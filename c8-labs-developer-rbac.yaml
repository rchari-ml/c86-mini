title: C8 Labs Developer
description: Minimal IAM permissions for namespace-scoped GKE developers for running C8 Labs
stage: GA
includedPermissions:
- resourcemanager.projects.get
- artifactregistry.repositories.downloadArtifacts
- container.clusters.connect
- container.clusters.get
- container.thirdPartyObjects.create
- container.thirdPartyObjects.delete
- container.thirdPartyObjects.get
- container.thirdPartyObjects.list
- container.thirdPartyObjects.update
# below are associated with backed config - ingress spec
- container.backendConfigs.get
- container.backendConfigs.list
- container.backendConfigs.create
- container.backendConfigs.update
- container.backendConfigs.delete
# below are list of entries for Log Analytics Explorer view access
- logging.buckets.get
- logging.buckets.list
- logging.exclusions.get
- logging.exclusions.list
- logging.links.get
- logging.links.list
- logging.locations.get
- logging.locations.list
- logging.logEntries.list
- logging.logMetrics.get
- logging.logMetrics.list
- logging.logScopes.get
- logging.logScopes.list
- logging.logServiceIndexes.list
- logging.logServices.list
- logging.logs.list
- logging.operations.get
- logging.operations.list
- logging.queries.getShared
- logging.queries.listShared
- logging.queries.usePrivate
- logging.sinks.get
- logging.sinks.list
- logging.usage.get
- logging.views.get
- logging.views.list
- observability.scopes.get
