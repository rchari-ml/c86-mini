apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: c8-labs-participant
rules:
  # additional c8-labs permissions
  - apiGroups: [""]
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups: [""]
    resources:
      - pods/exec
    verbs:
      - create
      - get
  # Allow viewing metrics (Fixes the error on browser)
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
